<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #4f8ef7;
      --primary-rgb: 79, 142, 247;
      --bg: #080c14;
      --bg-card: #111827;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --border: rgba(255,255,255,0.08);
    }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .login-logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 30%, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .login-sub {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .form-field {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .form-field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      padding: 1.1rem 1rem 0.5rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-field label {
      position: absolute;
      left: 1rem;
      top: 0.85rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: all 0.2s;
      pointer-events: none;
    }

    .form-field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.1);
    }

    .form-field input:focus + label,
    .form-field input:not(:placeholder-shown) + label {
      top: 0.3rem;
      font-size: 0.72rem;
      color: var(--primary);
    }

    .error-msg {
      display: none;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      text-align: center;
    }
    .error-msg.visible { display: block; }

    .btn-login {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.875rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(var(--primary-rgb), 0.35);
      margin-top: 0.25rem;
    }

    .btn-login:hover {
      background: #3a7ded;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(var(--primary-rgb), 0.45);
    }

    .btn-login:active { transform: translateY(0); }

    .btn-login.loading { opacity: 0.7; cursor: not-allowed; }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="login-wrap">
    <div class="login-header">
      <div class="login-logo">신준호</div>
      <p class="login-sub">포트폴리오에 오신 것을 환영합니다</p>
    </div>
    <div class="login-card">
      <div class="error-msg" id="error-msg">아이디 또는 비밀번호가 올바르지 않습니다.</div>
      <form onsubmit="login(event)">
        <div class="form-field">
          <input type="text" id="username" placeholder=" " required autocomplete="username" />
          <label for="username">아이디</label>
        </div>
        <div class="form-field">
          <input type="password" id="password" placeholder=" " required autocomplete="current-password" />
          <label for="password">비밀번호</label>
        </div>
        <button type="submit" class="btn-login" id="login-btn">로그인</button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8080';

    // 이미 로그인된 경우 바로 프로필로
    (async function () {
      try {
        const res = await fetch(`${API_BASE}/api/me`, { credentials: 'include' });
        if (res.ok) window.location.href = 'profile.html';
      } catch (e) {}
    })();

    async function login(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errorEl = document.getElementById('error-msg');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      btn.classList.add('loading');
      btn.textContent = '로그인 중...';
      errorEl.classList.remove('visible');

      try {
        const res = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          btn.textContent = '✓ 이동 중...';
          window.location.href = 'profile.html';
        } else {
          errorEl.classList.add('visible');
          btn.textContent = '로그인';
          btn.classList.remove('loading');
        }
      } catch (e) {
        errorEl.classList.add('visible');
        btn.textContent = '로그인';
        btn.classList.remove('loading');
      }
    }

    // 파티클 배경
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let particles = [], animId;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function mkParticle() {
        return {
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.5 + 0.3,
          dx: (Math.random() - 0.5) * 0.3,
          dy: (Math.random() - 0.5) * 0.3,
          a: Math.random() * 0.4 + 0.1
        };
      }

      function init() { resize(); particles = Array.from({ length: 70 }, mkParticle); }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.dx; p.y += p.dy;
          if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(79,142,247,${p.a})`;
          ctx.fill();
        });
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const d = Math.sqrt(dx*dx + dy*dy);
            if (d < 100) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(79,142,247,${0.05*(1-d/100)})`;
              ctx.lineWidth = 0.7;
              ctx.stroke();
            }
          }
        }
        animId = requestAnimationFrame(draw);
      }

      init(); draw();
      window.addEventListener('resize', () => { cancelAnimationFrame(animId); init(); draw(); });
    })();
  </script>
</body>
</html>
