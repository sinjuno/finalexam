<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>신준호 — 포트폴리오</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:    #030303;
      --card:  #0C0C0C;
      --text:  #F0F0EC;
      --muted: #555;
      --gold:  #D4AF37;
      --glt:   #F0D878;
      --gdk:   #9A7A1A;
      --gbdr:  rgba(212,175,55,.4);
      --gdim:  rgba(212,175,55,.1);
      --ease:  cubic-bezier(.4,0,.2,1);
    }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* 노이즈 텍스처 */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px; opacity: .025; pointer-events: none;
    }

    /* 배경 골드 glow */
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 700px 500px at 15% 85%, rgba(212,175,55,.04) 0%, transparent 70%),
        radial-gradient(ellipse 500px 400px at 85% 15%, rgba(212,175,55,.03) 0%, transparent 70%);
      pointer-events: none;
    }

    canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .35; }

    /* 카드 */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 460px; margin: 1.5rem;
      padding: 3.25rem 3rem;
      background: linear-gradient(var(--card), var(--card)) padding-box,
        linear-gradient(145deg, rgba(212,175,55,.7), rgba(212,175,55,.08) 40%, rgba(255,255,255,.04) 60%, rgba(212,175,55,.4)) border-box;
      border: 1px solid transparent;
      animation: cardIn .7s var(--ease) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(32px) scale(.97); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }

    /* 상단 골드 라인 */
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--glt), var(--gold), transparent);
    }

    /* 로고 */
    .logo {
      font-family: 'Syne', sans-serif; font-size: 2.5rem; font-weight: 800;
      letter-spacing: -2px; line-height: 1;
      background: linear-gradient(105deg, #aaa 0%, #fff 20%, var(--gold) 38%, #fff 55%, var(--glt) 70%, #fff 85%, #999 100%);
      background-size: 300% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: metalSweep 5s linear infinite;
      margin-bottom: .5rem;
    }
    @keyframes metalSweep {
      from { background-position: 200% center; }
      to   { background-position: 0% center; }
    }

    .sub { font-size: .82rem; color: var(--muted); font-weight: 300; margin-bottom: 2.75rem; letter-spacing: .02em; }

    /* 에러 */
    .err {
      display: none;
      background: rgba(239,68,68,.07); border: 1px solid rgba(239,68,68,.2);
      color: #f87171; padding: .7rem 1rem; font-size: .8rem; margin-bottom: 1.25rem;
    }
    .err.on { display: block; }

    /* 인풋 */
    .field { position: relative; margin-bottom: 2rem; }
    .field input {
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid #222; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: .95rem;
      padding: .85rem 0 .5rem; outline: none; transition: border-color .3s;
    }
    .field label {
      position: absolute; left: 0; top: .85rem; font-size: .875rem; color: var(--muted);
      transition: all .25s var(--ease); pointer-events: none;
    }
    .field::after {
      content: ''; position: absolute; bottom: 0; left: 0;
      width: 0; height: 1px;
      background: linear-gradient(90deg, var(--gdk), var(--gold), var(--glt));
      transition: width .4s var(--ease);
    }
    .field:focus-within::after { width: 100%; }
    .field input:focus + label,
    .field input:not(:placeholder-shown) + label {
      top: -.75rem; font-size: .68rem; color: var(--gold); letter-spacing: .12em; text-transform: uppercase;
    }

    /* 버튼 */
    .btn {
      width: 100%; border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--gdk), var(--gold), var(--glt));
      background-size: 200% auto;
      color: #000; padding: 1.05rem; margin-top: .5rem;
      font-family: 'Syne', sans-serif; font-size: .95rem; font-weight: 700;
      letter-spacing: .06em;
      transition: background-position .4s, transform .2s, box-shadow .2s;
      box-shadow: 0 4px 24px rgba(212,175,55,.22);
    }
    .btn:hover:not(.loading) {
      background-position: right center;
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(212,175,55,.32);
    }
    .btn.loading { opacity: .6; cursor: not-allowed; }

    .footer { text-align: center; margin-top: 2rem; font-size: .72rem; color: #2a2a2a; }
  </style>
</head>
<body>

  <canvas id="c"></canvas>

  <div class="card">
    <div class="logo">신준호</div>
    <p class="sub">풀스택 개발자 포트폴리오에 오신 것을 환영합니다.</p>

    <div class="err" id="err">아이디 또는 비밀번호를 확인해주세요.</div>

    <form onsubmit="login(event)">
      <div class="field">
        <input type="text" id="uid" placeholder=" " required autocomplete="username"/>
        <label for="uid">아이디</label>
      </div>
      <div class="field">
        <input type="password" id="pw" placeholder=" " required autocomplete="current-password"/>
        <label for="pw">비밀번호</label>
      </div>
      <button type="submit" class="btn" id="btn">로그인</button>
    </form>

    <p class="footer">© 2025 신준호. All rights reserved.</p>
  </div>

  <script>
    const API = 'http://localhost:8080';

    /* 파티클 (골드) */
    (function(){
      const c = document.getElementById('c');
      const ctx = c.getContext('2d');
      let pts=[], id;
      const resize = () => { c.width=innerWidth; c.height=innerHeight; };
      const mkP = () => ({
        x:Math.random()*c.width, y:Math.random()*c.height,
        r:Math.random()*1.5+.3,
        dx:(Math.random()-.5)*.3, dy:(Math.random()-.5)*.3,
        a:Math.random()*.35+.05
      });
      const init = () => { resize(); pts=Array.from({length:70},mkP); };
      const draw = () => {
        ctx.clearRect(0,0,c.width,c.height);
        pts.forEach(p=>{
          p.x+=p.dx; p.y+=p.dy;
          if(p.x<0||p.x>c.width) p.dx*=-1;
          if(p.y<0||p.y>c.height) p.dy*=-1;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
          ctx.fillStyle=`rgba(212,175,55,${p.a})`; ctx.fill();
        });
        for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
          const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y;
          const d=Math.sqrt(dx*dx+dy*dy);
          if(d<100){ ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y);
            ctx.strokeStyle=`rgba(212,175,55,${.04*(1-d/100)})`; ctx.lineWidth=.6; ctx.stroke(); }
        }
        id=requestAnimationFrame(draw);
      };
      init(); draw();
      window.addEventListener('resize',()=>{ cancelAnimationFrame(id); init(); draw(); });
    })();

    /* 이미 로그인 */
    (async()=>{
      try { const r=await fetch(`${API}/api/me`,{credentials:'include'}); if(r.ok) location.href='profile.html'; } catch(e){}
    })();

    async function login(e){
      e.preventDefault();
      const btn=document.getElementById('btn');
      const err=document.getElementById('err');
      btn.classList.add('loading'); btn.textContent='확인 중...'; err.classList.remove('on');
      try {
        const r=await fetch(`${API}/api/login`,{
          method:'POST', headers:{'Content-Type':'application/json'},
          credentials:'include', body:JSON.stringify({username:uid.value,password:pw.value})
        });
        if(r.ok){ btn.textContent='이동 중...'; location.href='profile.html'; }
        else { err.classList.add('on'); btn.textContent='로그인'; btn.classList.remove('loading'); }
      } catch(e){ err.classList.add('on'); btn.textContent='로그인'; btn.classList.remove('loading'); }
    }
  </script>
</body>
</html>
